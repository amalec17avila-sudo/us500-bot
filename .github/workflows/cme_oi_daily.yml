name: CME ES Open Interest Daily

on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch_oi:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pdfplumber

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch CME ES Open Interest
        run: python scripts/fetch_cme_oi.py

      - name: Commit and push data
        run: |
          git config --global user.name "CME OI Bot"
          git config --global user.email "bot@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}
          git add data/ || true
          git diff --staged --quiet || git commit -m "Update ES OI data $(date +%Y-%m-%d)"
          git push || echo "Nothing to push"
